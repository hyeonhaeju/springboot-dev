plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0' // Spring Boot 버전 3.4.0
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'dev.hyeon'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // java는 jdk 21
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // 추가
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 스프링 데이터
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    }

test {
    useJUnitPlatform()
}